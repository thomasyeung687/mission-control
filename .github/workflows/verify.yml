name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Formatting
        run: npx -y prettier@3.9.10 --check .
      - name: Sample roster is valid JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("dashboard/roster.example.json", "utf8"))'
